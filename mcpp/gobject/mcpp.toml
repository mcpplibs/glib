# gobject — the type system.
#
# GType, GObject, signals, properties, closures and GValue. Every library that
# says "GObject-based" means this: pango's PangoFontMap, gio's GFile, gtk's
# GtkWidget are all GObjects, and so is the binding machinery every language
# binding generates against.
#
# ─────────────────────────────────────────────────────────────────────────
# ONE build.mcpp, THREE MEMBERS
#
# The generators live in `mcpp/glib/build.mcpp` and write into `mcpp/include`,
# which all three members name FIRST in `include_dirs`. That is not tidiness:
# `gobject-visibility.h` is produced by the same tool invocation as glib's, and
# `glib-enumtypes.{h,c}` — which belong to gobject — are generated by scanning a
# header that belongs to glib. Splitting the generator would mean running it
# twice with the same inputs and hoping the two agreed.
#
# So gobject's `build.mcpp` does nothing but wait for glib's: the path
# dependency below is what orders them.
#
# ⚠️ `glib-enumtypes.c` IS COMPILED HERE, not in glib. It calls
# `g_enum_register_static`, which is a gobject symbol; compiling it into glib
# would make glib depend on gobject and invert the stack.
[package]
namespace   = "gnome"
name        = "gobject"
version     = "2.82.5"
standard    = "c++23"
description = "GObject 2.82.5 — the GLib type system: GType, signals, properties, closures and GValue"
license     = "LGPL-2.1-or-later"
repo        = "https://gitlab.gnome.org/GNOME/glib"

[build]
sources = [
    "../../upstream/gobject/gatomicarray.c",
    "../../upstream/gobject/gbinding.c",
    "../../upstream/gobject/gbindinggroup.c",
    "../../upstream/gobject/gboxed.c",
    "../../upstream/gobject/gclosure.c",
    "../../upstream/gobject/genums.c",
    "../../upstream/gobject/gmarshal.c",
    "../../upstream/gobject/gobject.c",
    "../../upstream/gobject/gparam.c",
    "../../upstream/gobject/gparamspecs.c",
    "../../upstream/gobject/gsignal.c",
    "../../upstream/gobject/gsignalgroup.c",
    "../../upstream/gobject/gsourceclosure.c",
    "../../upstream/gobject/gtype.c",
    "../../upstream/gobject/gtypemodule.c",
    "../../upstream/gobject/gtypeplugin.c",
    "../../upstream/gobject/gvaluearray.c",
    "../../upstream/gobject/gvalue.c",
    "../../upstream/gobject/gvaluetransform.c",
    "../../upstream/gobject/gvaluetypes.c",

    # Generated by THIS member's build.mcpp from glib/gunicode.h. Registers the
    # four Unicode enums as GTypes, which is why it is gobject's and not
    # glib's — and why gobject generates it rather than naming a file another
    # package's build program produces. See mcpp/common/generators.h.
    "include/gobject/glib-enumtypes.c",
]

include_dirs = [
    # FIRST — the generated tree, holding config.h, glibconfig.h and the
    # visibility headers. See mcpp/glib/mcpp.toml for why the ordering matters.
    "include",
    "../../upstream",
    "../../upstream/glib",
    "../../upstream/gobject",
]

cflags = [
    "-DGOBJECT_COMPILATION",
    '-DG_LOG_DOMAIN=\"GLib-GObject\"',
    "-DHAVE_CONFIG_H",
    "-D_GNU_SOURCE",
    "-D_POSIX_C_SOURCE=200809L",
    "-Wno-unused-parameter",
    "-Wno-missing-field-initializers",
    "-Wno-declaration-after-statement",
    "-fPIC",
]

ldflags = ["-lm", "-pthread"]

[targets.gobject-2_0]
kind = "lib"

[dependencies]
# A workspace path dependency, which is also what orders the generators: glib's
# build.mcpp writes ../include before anything here compiles.
gnome.glib = { path = "../glib" }

# GClosure marshalling calls through libffi for the generic case
# (g_cclosure_marshal_generic), which is how a binding invokes a signal handler
# whose signature it only knows at run time.
compat.libffi = "3.4.8"
